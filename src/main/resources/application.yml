spring:
  application:
    name: gitcine-backend

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]

  profiles:
    active: ${APP_PROFILE:${SPRING_PROFILES_ACTIVE:dev}}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        ddl-auto: validate
        jdbc:
          time_zone: UTC

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

  data:
    web:
      pageable:
        default-page-size: 12
        max-page-size: 50

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:7200000}
  issuer: ${JWT_ISSUER:gitcine-backend}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://ghost-shell-frontend.vercel.app,http://localhost:3000,http://localhost:5173,http://localhost:8080}
  admin-email: ${ADMIN_EMAIL:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method


management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when_authorized